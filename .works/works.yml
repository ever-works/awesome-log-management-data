company_name: Awesome Log Management
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Log Management
initial_prompt: >-
  A curated directory of log management, log analytics and log-pipeline tools,
  SaaS and open source. Include products such as Datadog Log Management, Splunk,
  Elastic, Grafana Loki, Better Stack Logs, Papertrail, Sumo Logic, Axiom,
  OpenObserve, SigNoz, Vector, Graylog, plus other notable commercial and
  open-source options. Categories: Log Management SaaS, Open-Source Log Stacks,
  Log Pipelines & Collectors, Log Analytics & Search, Cloud-Native Logging,
  Low-Cost Log Storage. For every item capture the official website, a short
  factual description, pricing model (free, freemium, paid, open source),
  deployment (cloud or self-hosted), key features and integrations.


  Initial categories: Log Management SaaS; Open-Source Log Stacks; Log Pipelines
  & Collectors; Log Analytics & Search; Cloud-Native Logging; Low-Cost Log
  Storage.

  Target keywords: log management, log analytics, centralized logging, logging
  platform.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://github.com/ripienaar/free-for-dev#log-management

  - https://opentelemetry.io/ecosystem/vendors/

  - https://www.opensourcealternative.to/category/log-management

  - https://raw.githubusercontent.com/roundrobin/awesome-logging/HEAD/README.md

  - https://github.com/topics/logging

  - https://github.com/topics/log-management


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-log-management-website
company_website: https://log-management.ever.works
