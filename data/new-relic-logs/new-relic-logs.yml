markdown: >-
  ## Overview


  New Relic Logs is a cloud-native SaaS log management tool that is strongest
  when used as part of the broader New Relic platform. Its log-in-context
  feature connects individual log lines directly to distributed traces, errors,
  and infrastructure metrics, reducing mean time to resolution (MTTR) during
  incidents.


  ## Key Features


  - Log-in-context: link log lines to APM traces and errors

  - NRQL (New Relic Query Language) for powerful analytics

  - Automatic log parsing with built-in rules

  - Pattern detection and log clustering

  - Infinite tracing for high-volume distributed systems

  - Integration with New Relic APM, infrastructure metrics, and traces


  ## Pricing Model


  - Free tier: 100 GB per month

  - Paid: $0.30 per GB after the free allowance

  - Per-user seat pricing model can become expensive for larger teams


  ## Deployment


  SaaS (fully managed cloud service)


  ## Best For


  Teams already using New Relic for APM or infrastructure monitoring who want
  logs integrated into the same workflow.
