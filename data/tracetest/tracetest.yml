markdown: >-
  # Tracetest


  ## Overview

  Tracetest is a trace-based testing platform that natively supports
  OpenTelemetry via OTLP. It enables testing of distributed systems using
  distributed traces for end-to-end validation.


  ## Features

  - Native OpenTelemetry support via OTLP

  - Trace-based testing

  - Distributed system validation

  - End-to-end testing

  - Open-source core with commercial offerings


  ## Pricing

  Mixed open-source and commercial.


  ## Deployment

  Self-hosted or cloud.


  ## Documentation

  https://docs.tracetest.io/
