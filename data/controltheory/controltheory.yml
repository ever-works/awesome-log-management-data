markdown: >-
  # ControlTheory


  ## Overview

  ControlTheory is an observability platform that natively supports
  OpenTelemetry via OTLP. It offers observability pipelines and data management
  capabilities with a mixed open-source and commercial model.


  ## Features

  - Native OpenTelemetry support via OTLP

  - Observability pipelines

  - Data management and routing

  - Mixed open-source and commercial offering


  ## Pricing

  Mixed open-source and commercial.


  ## Deployment

  Self-hosted or cloud.


  ## Documentation

  https://docs.controltheory.com/
