markdown: >-
  # OneUptime


  ## Overview

  OneUptime is an observability platform that natively supports OpenTelemetry
  via OTLP. It combines monitoring, logging, tracing, and incident management in
  a single platform for application reliability.


  ## Features

  - Native OpenTelemetry support via OTLP

  - Application monitoring

  - Log management

  - Distributed tracing

  - Incident management

  - Status pages

  - Open-source and commercial offerings


  ## Pricing

  Mixed open-source and commercial; free tier available.


  ## Deployment

  Self-hosted or cloud.


  ## Documentation

  https://oneuptime.com/docs/
