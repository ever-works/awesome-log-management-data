markdown: >-
  ## Overview


  Logstash is a free and open server-side data processing pipeline that ingests
  data from a multitude of sources simultaneously, transforms it, and then sends
  it to your favorite stash.


  ## Features


  - Ingest data from a multitude of sources simultaneously

  - Transform data with a wide range of filters

  - Send data to a wide variety of destinations

  - Plugin architecture for inputs, filters, and codecs, and outputs

  - Apache 2.0 licensed


  ## Pricing


  Free and open source under the Apache 2.0 license. Source code available at
  https://github.com/elastic/logstash
