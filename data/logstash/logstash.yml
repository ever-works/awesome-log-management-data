name: Logstash
description: Logstash is an open-source server-side data processing pipeline
  that ingests, transforms, and transports logs, events, and other data from a
  wide variety of sources to a wide variety of sinks. It is part of the Elastic
  Stack and is licensed under the Apache 2.0 license.
