markdown: >-
  # Jaeger


  ## Overview

  Jaeger is an open-source, end-to-end distributed tracing platform. It natively
  consumes OpenTelemetry data via OTLP and is used for monitoring and
  troubleshooting complex microservices architectures. Jaeger is a graduated
  project of the Cloud Native Computing Foundation (CNCF).


  ## Features

  - Native OpenTelemetry support via OTLP

  - Distributed context propagation

  - Distributed transaction monitoring

  - Root cause analysis

  - Service dependency analysis

  - Performance and latency optimization

  - Multiple storage backends (Elasticsearch, Cassandra, etc.)


  ## Pricing

  Free and open-source under the Apache License 2.0.


  ## Deployment

  Self-hosted.


  ## Repository

  https://github.com/jaegertracing/jaeger


  ## Documentation

  https://www.jaegertracing.io/docs/
